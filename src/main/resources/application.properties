spring.application.name=Sistema-Gestion-Hospitalizacion
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gestion_hospitalizacion}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jackson.locale=es
spring.jackson.date-format=dd/MM/yyyy HH:mm:ss
spring.jackson.time-zone=America/Lima

# CORS permitido (separado por comas)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Bootstrap admin (solo si tabla usuarios vacía)
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USER:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
