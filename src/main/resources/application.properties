spring.application.name=Evaluacion
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gestion_hospitalizacion}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jackson.time-zone=America/Lima
# Sin spring.jackson.date-format: los LocalDateTime se serializan en ISO-8601,
# formato que el frontend (dayjs) sí puede interpretar.

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USER:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
